name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Generate placeholder icons (only if missing)
        run: node scripts/gen-placeholder-icons.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Validate plugin bundle
        run: |
          set +e
          npm install -g @elgato/cli > cli-install.txt 2>&1
          install_status=$?
          streamdeck validate com.gameaday.mediamaid.sdPlugin > validate-output.txt 2>&1
          validate_status=$?
          if [ "$install_status" -ne 0 ]; then
            echo "::error title=cli install failed (exit $install_status)::first lines follow"
            head -n 10 cli-install.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=cli install::${line}"
            done
          fi
          if [ "$validate_status" -ne 0 ]; then
            echo "::error title=streamdeck validate failed (exit $validate_status)::first lines follow"
            head -n 10 validate-output.txt | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=streamdeck validate::${line}"
            done
          fi
          exit "$validate_status"
