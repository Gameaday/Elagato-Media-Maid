name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build plugin
        run: npm run build

      - name: Validate plugin bundle
        run: |
          npm install -g @streamdeck/cli
          if streamdeck validate com.gameaday.mediamaid.sdPlugin > validate-output.txt 2>&1; then
            status=0
          else
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::error title=streamdeck validate::${line}"
              fi
            done < validate-output.txt
          fi
          exit $status
